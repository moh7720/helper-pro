<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Failed - Email Exists</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .back-button:hover {
            color: #6366f1; 
            border-color: rgba(99, 102, 241, 0.3);
            background-color: rgba(99, 102, 241, 0.05);
            transform: translateX(-3px);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .login-error-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px; 
            text-align: center;
            color: white;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease-out;
        }

        .error-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            background-color: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            color: #818cf8;
            margin-bottom: 20px;
        }

        .error-icon svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .login-error-card h2 {
            color: #f3f4f6;
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-error-card p {
            color: #9ca3af;
            line-height: 1.6;
            margin: 0 0 28px 0;
            font-size: 15px;
        }

        .register-btn {
            display: block;
            text-decoration: none;
            background: #3b82f6; 
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
            transition: all 0.2s ease;
        }

        .register-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 6px 12px;
                font-size: 13px;
            }
            .login-error-card {
                margin: 0 20px;
                padding: 35px 20px;
            }
            .login-error-card h2 {
                font-size: 21px;
            }
            .login-error-card p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <a href="/" class="back-button">
        <svg viewBox="0 0 24 24">
            <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/>
        </svg>
        Ana Sayfa
    </a>

    <div class="login-error-card">
        <div class="error-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M12,5C13.66,5 15,6.34 15,8C15,9.66 13.66,11 12,11C10.34,11 9,9.66 9,8C9,6.34 10.34,5 12,5M12,19.2C10.05,19.2 8.28,18.2 7.2,16.63C7.23,15.04 10.4,14.16 12,14.16C13.6,14.16 16.77,15.04 16.8,16.63C15.72,18.2 13.95,19.2 12,19.2Z"/>
            </svg>
        </div>

        <h2>Kayıt Başarısız Oldu</h2>

        <p>Bu e-posta adresi zaten kayıtlı. Lütfen hesabınızla giriş yapmayı deneyin.</p>

        <a href="/login.html" class="register-btn">
            Go to Login
        </a>
    </div>

</body>
</html>
