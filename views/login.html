<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .back-button:hover {
            color: #3b82f6; /* توهج أزرق متناسق مع زر الـ Login */
            border-color: rgba(59, 130, 246, 0.3);
            background-color: rgba(59, 130, 246, 0.05);
            transform: translateX(-3px);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 380px; /* عرض مرن متوافق مع شاشات الهواتف */
            text-align: center;
            color: white;
            z-index: 1;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            outline: none;
            background-color: #1e293b;
            color: white;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background-color: #0f172a;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 13px;
            color: #9ca3af;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .remember-me input {
            width: auto;
            margin: 0;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .forgot-password {
            color: #3b82f6;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #3b82f6; 
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }
        
        button:active {
            transform: translateY(0);
        }

        p {
            margin-top: 25px;
            font-size: 14px;
            color: #9ca3af;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 6px 12px;
                font-size: 13px;
            }
            .container {
                margin: 0 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <a href="/" class="back-button">
        <svg viewBox="0 0 24 24">
            <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/>
        </svg>
        Ana Sayfa
    </a>

    <div class="container">
        <h2>Login</h2>

        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="E-posta" required autocomplete="email" />
            <input type="password" name="password" placeholder="Şifre" required />
            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Beni Unutma
                </label>
                <a href="/forgot-password" class="forgot-password">Şifremi Unuttum</a>
            </div>

            <button type="submit">Giriş Yap</button>
        </form>

        <p>Hesabınız yok mu? <a href="/register.html">Hesap Oluştur</a></p>
    </div>

</body>
</html>
