<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesajlasma Ekrani</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5eefc;
        }

        button, input, textarea {
            font: inherit;
        }

        .chat-app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 280px 1fr;
            background: #0f172a;
        }

        .sidebar {
            border-right: 1px solid #243247;
            background: #111827;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }

        .brand p {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .new-chat {
            border: none;
            border-radius: 8px;
            padding: 11px 12px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .chat-tabs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .chat-tab {
            border: 1px solid #243247;
            border-radius: 8px;
            padding: 11px;
            background: #0f172a;
            color: #cbd5e1;
            cursor: pointer;
            text-align: left;
        }

        .chat-tab.active {
            border-color: #38bdf8;
            background: #123047;
            color: white;
        }

        .chat-tab strong {
            display: block;
            font-size: 14px;
        }

        .chat-tab span {
            display: block;
            margin-top: 4px;
            color: #94a3b8;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            padding: 18px 24px;
            border-bottom: 1px solid #243247;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: #111827;
        }

        .topbar h2 {
            margin: 0;
            font-size: 22px;
        }

        .status {
            color: #93c5fd;
            font-size: 13px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .chart-button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .new-chat:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .chart-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #0b1220;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 72%;
            padding: 12px 14px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .assistant .bubble {
            background: #111827;
            border: 1px solid #243247;
            color: #e5eefc;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
        }

        .flowchart-panel {
            border-top: 1px solid #243247;
            background: #0b1220;
            padding: 18px 24px;
        }

        .flowchart-header {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .flowchart-header h3 {
            margin: 0;
            font-size: 16px;
            color: #e5eefc;
        }

        .flowchart-header p {
            margin: 6px 0 0;
            max-width: 760px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        .flowchart-canvas {
            overflow: auto;
            border: 1px solid #243247;
            border-radius: 8px;
            min-height: 220px;
            padding: 14px;
            background: #f8fafc;
            color: #0f172a;
        }

        .flowchart-canvas svg {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .composer {
            border-top: 1px solid #243247;
            background: #111827;
            padding: 16px 24px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }

        .composer textarea {
            width: 100%;
            min-height: 50px;
            max-height: 140px;
            resize: vertical;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .composer textarea:focus {
            border-color: #38bdf8;
        }

        .composer button {
            align-self: end;
            border: none;
            border-radius: 8px;
            padding: 13px 22px;
            background: #0f766e;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .composer button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        @media (max-width: 760px) {
            .chat-app {
                grid-template-columns: 1fr;
            }

            .sidebar {
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #243247;
            }

            .chat-tabs {
                flex-direction: row;
            }

            .chat-tab {
                min-width: 180px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .topbar-actions {
                width: 100%;
                justify-content: space-between;
            }

            .bubble {
                max-width: 90%;
            }

            .composer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: "default" });

        const { useEffect, useMemo, useRef, useState } = React;

        function createChat(number) {
            return {
                id: Date.now() + number,
                title: "Chat " + number,
                messages: [
                    {
                        role: "assistant",
                        content: "Merhaba! HELP BRO asistanına hoş geldiniz. Projeleriniz, iş akışınız veya veri analizleriniz hakkında size nasıl yardımcı olabilirim?"
                    }
                ]
            };
        }

        function App() {
            const [chats, setChats] = useState([]);
            const [activeChatId, setActiveChatId] = useState(null);
            const [input, setInput] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            const [isLoadingChats, setIsLoadingChats] = useState(true);
            const [isChartLoading, setIsChartLoading] = useState(false);
            const [error, setError] = useState("");
            const [flowchart, setFlowchart] = useState(null);
            const messagesRef = useRef(null);
            const flowchartRef = useRef(null);

            const activeChat = useMemo(() => {
                return chats.find((chat) => chat.id === activeChatId) || chats[0] || {
                    id: null,
                    title: "Loading",
                    messages: []
                };
            }, [chats, activeChatId]);

            useEffect(() => {
                let isMounted = true;

                async function loadChats() {
                    try {
                        const response = await fetch("/api/chats");
                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.error || "Could not load conversations");
                        }

                        if (isMounted) {
                            const savedChats = Array.isArray(data.chats) ? data.chats : [];
                            setChats(savedChats);
                            setActiveChatId(savedChats[0]?.id || null);
                        }
                    } catch (err) {
                        if (isMounted) {
                            setError(err.message);
                        }
                    } finally {
                        if (isMounted) {
                            setIsLoadingChats(false);
                        }
                    }
                }

                loadChats();

                return () => {
                    isMounted = false;
                };
            }, []);

            useEffect(() => {
                if (messagesRef.current) {
                    messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
                }
            }, [activeChat.messages, isLoading]);

            useEffect(() => {
                if (!flowchart || !flowchartRef.current) return;

                let isMounted = true;
                const renderId = "flowchart-" + activeChat.id + "-" + Date.now();

                mermaid.render(renderId, flowchart.mermaid)
                    .then(({ svg }) => {
                        if (isMounted && flowchartRef.current) {
                            flowchartRef.current.innerHTML = svg;
                        }
                    })
                    .catch((err) => {
                        if (isMounted) {
                            setError("Mermaid chart render failed: " + err.message);
                            if (flowchartRef.current) {
                                flowchartRef.current.textContent = flowchart.mermaid;
                            }
                        }
                    });

                return () => {
                    isMounted = false;
                };
            }, [flowchart, activeChat.id]);

            function updateActiveChat(messages) {
                setChats((currentChats) =>
                    currentChats.map((chat) =>
                        chat.id === activeChat.id ? { ...chat, messages } : chat
                    )
                );
            }

            function updateSavedChat(savedChat) {
                setChats((currentChats) =>
                    currentChats.map((chat) =>
                        chat.id === savedChat.id ? savedChat : chat
                    )
                );
            }

            async function addChat() {
                if (isLoading || isLoadingChats) return;

                setError("");

                try {
                    const response = await fetch("/api/chats", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" }
                    });
                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(data.error || "Could not create conversation");
                    }

                    setChats((currentChats) => [data.chat, ...currentChats]);
                    setActiveChatId(data.chat.id);
                    setInput("");
                    setFlowchart(null);
                } catch (err) {
                    setError(err.message);
                }
            }

            function selectChat(chatId) {
                setActiveChatId(chatId);
                setError("");
                setFlowchart(null);
            }

            async function sendMessage(event) {
                event.preventDefault();

                const text = input.trim();
                if (!text || isLoading || isLoadingChats || !activeChat.id) return;

                const userMessage = { role: "user", content: text };
                const nextMessages = [...activeChat.messages, userMessage];

                updateActiveChat(nextMessages);
                setInput("");
                setError("");
                setIsLoading(true);

                try {
                    const response = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ chatId: activeChat.id, messages: nextMessages })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(data.error || "Server error");
                    }

                    if (!data.reply || !data.chat) {
                        throw new Error("Empty response from Gemini");
                    }

                    updateSavedChat(data.chat);
                } catch (err) {
                    setError(err.message);
                    updateActiveChat([
                        ...nextMessages,
                        {
                            role: "assistant",
                            content: "Backend baglantisinda sorun olustu: " + err.message
                        }
                    ]);
                } finally {
                    setIsLoading(false);
                }
            }

            async function generateFlowchart() {
                if (isLoading || isChartLoading || !activeChat.id || activeChat.messages.length < 2) return;

                setError("");
                setFlowchart(null);
                setIsChartLoading(true);

                try {
                    const response = await fetch("/api/flowchart", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ chatId: activeChat.id, messages: activeChat.messages })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(data.error || "Server error");
                    }

                    if (!data.summary || !data.mermaid) {
                        throw new Error("Empty chart response from Gemini");
                    }

                    setFlowchart(data);
                    window.location.href = "/chart.html?chatId=" + encodeURIComponent(data.chatId || activeChat.id);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsChartLoading(false);
                }
            }

            function handleKeyDown(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage(event);
                }
            }

            return React.createElement("main", { className: "chat-app" },
                React.createElement("aside", { className: "sidebar" },
                    React.createElement("div", { className: "brand" },
                        React.createElement("h1", null, "HELP-PRO Chat"),
                        React.createElement("p", null, "React ile mesajlasma ekrani")
                    ),
                    React.createElement("button", {
                        className: "new-chat",
                        onClick: addChat,
                        disabled: isLoading || isLoadingChats
                    }, "New Chat"),
                    React.createElement("div", { className: "chat-tabs" },
                        chats.map((chat) =>
                            React.createElement("button", {
                                key: chat.id,
                                className: "chat-tab" + (chat.id === activeChat.id ? " active" : ""),
                                onClick: () => selectChat(chat.id)
                            },
                                React.createElement("strong", null, chat.title),
                                React.createElement("span", null, chat.messages[chat.messages.length - 1]?.content || "No messages yet")
                            )
                        )
                    )
                ),
                React.createElement("section", { className: "main-panel" },
                    React.createElement("header", { className: "topbar" },
                        React.createElement("div", null,
                            React.createElement("h2", null, activeChat.title),
                            React.createElement("div", { className: "status" },
                                isLoadingChats ? "Conversations loading..." : isLoading ? "Gemini cevap yaziyor..." : isChartLoading ? "Chart hazirlaniyor..." : "Gemini API baglandi"
                            )
                        ),
                        React.createElement("div", { className: "topbar-actions" },
                            React.createElement("button", {
                                className: "chart-button",
                                type: "button",
                                onClick: generateFlowchart,
                                disabled: isLoadingChats || isLoading || isChartLoading || !activeChat.id || activeChat.messages.length < 2
                            }, isChartLoading ? "Generating" : "Generate Chart"),
                            error ? React.createElement("div", { className: "status" }, error) : null
                        )
                    ),
                    React.createElement("div", { className: "messages", ref: messagesRef },
                        activeChat.messages.map((message, index) =>
                            React.createElement("div", {
                                key: index,
                                className: "message " + message.role
                            },
                                React.createElement("div", { className: "bubble" }, message.content)
                            )
                        ),
                        isLoading ? React.createElement("div", { className: "message assistant" },
                            React.createElement("div", { className: "bubble" }, "Typing...")
                        ) : null
                    ),
                    flowchart ? React.createElement("section", { className: "flowchart-panel" },
                        React.createElement("div", { className: "flowchart-header" },
                            React.createElement("div", null,
                                React.createElement("h3", null, "Project Flowchart"),
                                React.createElement("p", null, flowchart.summary)
                            )
                        ),
                        React.createElement("div", { className: "flowchart-canvas", ref: flowchartRef })
                    ) : null,
                    React.createElement("form", { className: "composer", onSubmit: sendMessage },
                        React.createElement("textarea", {
                            value: input,
                            onChange: (event) => setInput(event.target.value),
                            onKeyDown: handleKeyDown,
                            placeholder: "Mesajinizi yazin...",
                            disabled: isLoading || isLoadingChats
                        }),
                        React.createElement("button", { type: "submit", disabled: isLoading || isLoadingChats || !activeChat.id || input.trim() === "" },
                            isLoading ? "Sending" : "Send"
                        )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
</body>
</html>
