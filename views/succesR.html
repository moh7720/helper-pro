<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.06) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .back-button:hover {
            color: #22c55e; 
            border-color: rgba(34, 197, 94, 0.3);
            background-color: rgba(34, 197, 94, 0.05);
            transform: translateX(-3px);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(34, 197, 94, 0.15); 
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px; 
            text-align: center;
            color: white;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: scaleUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 72px;
            height: 72px;
            background-color: rgba(34, 197, 94, 0.1);
            border-radius: 50%;
            color: #22c55e;
            margin-bottom: 24px;
        }

        .success-icon svg {
            width: 38px;
            height: 38px;
            fill: currentColor;
        }

        .success-card h2 {
            color: #22c55e; 
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .success-card p {
            color: #9ca3af;
            line-height: 1.6;
            margin: 0 0 28px 0;
            font-size: 15px;
        }

        .login-btn {
            display: block;
            text-decoration: none;
            background: #22c55e;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #16a34a;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 640px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 6px 12px;
                font-size: 13px;
            }
            .success-card {
                margin: 0 20px;
                padding: 35px 20px;
            }
            .success-card h2 {
                font-size: 22px;
            }
            .success-card p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <a href="/" class="back-button">
        <svg viewBox="0 0 24 24">
            <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/>
        </svg>
        Ana Sayfa
    </a>

    <div class="success-card">
        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
        </div>

        <h2>Başarı!</h2>

        <p>Hesabınız başarıyla kaydedildi. Artık kontrol panelinize giriş yapabilirsiniz.</p>

        <a href="/login" class="login-btn">
            Login
        </a>
    </div>

</body>
</html>
