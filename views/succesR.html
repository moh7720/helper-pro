<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      animation: fadeIn 0.8s ease-in-out;
    }

    .icon {
      width: 80px;
      height: 80px;
      background: #e6ffed;
      color: #2ecc71;
      font-size: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
    }

    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #4facfe;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4b6279;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon">✓</div>

    <p>
        yor accuont regesterd succesfuly
    </p>

    <a href="/login.html" class="btn"> login</a>
  </div>

</body>
</html>
